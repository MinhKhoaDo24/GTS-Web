services:
  postgres:
    image: postgres:16-alpine
    container_name: gts-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gts_db}
    # Không expose port 5432 ra ngoài host (chỉ kết nối nội bộ giữa containers)
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tự động chạy các file SQL khi khởi tạo DB lần đầu (01_schema → 02_indexes → 03_triggers → 04_migration)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gts_user} -d ${POSTGRES_DB:-gts_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gts-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
