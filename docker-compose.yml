services:
  postgres:
    image: postgres:16-alpine
    container_name: gts-postgres
    restart: always
    environment:
      POSTGRES_USER: gts_user
      POSTGRES_PASSWORD: gts_password_2024
      POSTGRES_DB: gts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gts_user -d gts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gts-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://gts_user:gts_password_2024@postgres:5432/gts_db?schema=public
      - NEXTAUTH_SECRET=gts-hardware-secret-b2b-production-key-2024
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
